name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  check-and-build:
    name: Flake Check & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v8

      - name: Check Nix code formatting (Alejandra)
        run: nix run nixpkgs#alejandra -- --check .

      - name: Lint Nix code (Statix)
        run: nix run nixpkgs#statix -- check .

      - name: Check for dead Nix code (Deadnix)
        run: nix run nixpkgs#deadnix -- --fail .

      - name: Run nix flake check
        run: nix flake check

      - name: Build default package
        run: nix build .#default --no-link

      - name: Verify CLI status & help
        run: |
          nix run .#default -- --help
          nix run .#default -- status

  megalinter:
    name: MegaLinter
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Run MegaLinter
        uses: oxsecurity/megalinter@v10.1.0
        env:
          VALIDATE_ALL_CODEBASE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload MegaLinter reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: megalinter-reports
          path: |
            megalinter-reports
